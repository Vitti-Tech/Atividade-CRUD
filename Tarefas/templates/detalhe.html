<h1>{{ tarefa.titulo}}</h1>

<p><strong>Descrião:</strong>{{ tarefa.descricao|default:"Sem descrição"  }}</p>
<p><strong>Prioridade:</strong>{{ tarefa.get_prioridade_display  }}</p>
<p><strong>Status:</strong> {% if tarefa.concluida %}Concluída{% else %}Pendente{% endif %}</p>
<p><strong>Criada em:</strong>{{ tarefa.criada_em  }}</p>

<a href="{% url 'editar_tarefa' tarefa.pk %}">Editar</a>
<a href="{% url 'excluir_tarefa' tarefa.pk %}">Excluir</a>

<form action="{% url 'alternar_tarefa' tarefa.pk %}" method="post">
  {% csrf_token %}
  <button type="submit">
    {% if tarefa.concluida %}Marcar como pendente{% else %}Marcar como concluída{% endif %}
  </button>
</form>

<a href="{% url 'lista_tarefas' %}">Voltar à lista</a>
